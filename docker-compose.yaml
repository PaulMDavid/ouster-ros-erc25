services:
  ros:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    container_name: app_ouster_lidar_container
    tty: true
    stdin_open: true

    # Mount your project directories
    #NOTE: remove  or add volumes as needed, and adjust paths if necessary
    volumes:
      - ./ouster-ros:/workspace/src/ouster-ros
      - ./ouster-sensor-msgs:/workspace/src/ouster-sensor-msgs
      - ./LICENSE:/workspace/src/LICENSE
      - ./data:/workspace/data
      - ./config:/workspace/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./ouster-ros/config:/workspace/install/ouster_ros/share/ouster_ros/config

    environment:
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=0
    #NOTE check the OUSTER_SENSOR_HOSTNAME
      - OUSTER_SENSOR_HOSTNAME=169.254.61.114
      - OUSTER_LIDAR_MODE=1024x10


    # Allows GUI tools (rviz, rqt, etc.)
    network_mode: host
    privileged: true

    working_dir: /workspace

    command: ros2 launch ouster_ros driver.launch.py sensor_hostname:=169.254.61.114 lidar_mode:=1024x10 viz:=false
    #command: tail -f /dev/null
